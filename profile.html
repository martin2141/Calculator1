<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Page</title>
    <style>
        /* Modern Reset and Font Settings */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Profile Container Setup */
        .profile-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
        }

        /* Profile Image Placement */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            color: #007bff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Social Links List */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            list-style: none;
            margin-bottom: 25px;
        }

        .social-links a {
            text-decoration: none;
            color: #555555;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: #007bff;
            color: #ffffff;
            border-color: #007bff;
        }

        /* Call to Action Button */
        .btn-contact {
            display: inline-block;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn-contact:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Profile Picture Placeholder -->
        <img src="profileimg.jpg" alt="Jane Doe Profile Picture" class="profile-img">
        
        <!-- User Information -->
        <h1>Wild Cat</h1>
        <div class="title">Web Developer</div>
        <p class="bio">
            Hi! I am a passionate developer who loves crafting clean code and intuitive user experiences. When I'm not coding, you can find me exploring the outdoors or reading.
        </p>
        
        <!-- Navigation/Social Networks -->
        <ul class="social-links">
            <li><a href="https://github.com" target="_blank">GitHub</a></li>
            <li><a href="https://linkedin.com" target="_blank">LinkedIn</a></li>
            <li><a href="https://twitter.com" target="_blank">Twitter</a></li>
        </ul>
        
        <!-- Contact Button -->
        <a href="index.html" class="btn-contact">Back To Calculator</a>
    </div>

</body>
</html>
